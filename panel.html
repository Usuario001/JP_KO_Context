<!DOCTYPE html>
<html lang="es">
<head>
    <title>JP Knockout</title>
    <meta charset="utf-8">
    <style>
        body { font-family: sans-serif; padding: 10px; background: #282828; color: white; font-size: 11px; }
        pre { background: #eee; padding: 10px; border-radius: 8px; }
        li,p { overflow-wrap: break-word; white-space: normal; }
        strong { color: #5cd5fb; }
        #filter, #inspect { border-radius: 3px; border: none; padding: 7px; margin-bottom: 10px; }
        h3 { margin: 0; }
    </style>
</head>
<body>
<h2>JP Panel Knockout Context Inspector</h2>
<div>
    <input id="filter" name="filter" type="text" placeholder="Buscar propiedad"></input>
    <button id="inspect">Obtener uiComponent del elemento seleccionado</button>
</div>
<div id="outputFilter" style="background: #ffffff; color: #000000;">
</div>

<pre style="background: #282828; color: white;" id="output"></pre>
<script src="panel.js"></script>
</body>
</html>
